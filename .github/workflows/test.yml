name: Test

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Resolve Dependencies
        run: xcodebuild -resolvePackageDependencies -project Cirruscope.xcodeproj

      # Builds the app and the test bundle, then runs the unit tests. Debug because `@testable import Cirruscope`
      # needs the testability the Release configuration does not enable. This replaces the former separate Debug
      # build step, which this action performs anyway.
      - name: Test
        run: xcodebuild test -project Cirruscope.xcodeproj -scheme 'Cirruscope for macOS' -configuration Debug -destination 'platform=macOS' -resultBundlePath TestResults.xcresult

      # The tests cannot cover this: Release compiles with whole-module optimization and without testability, so it
      # can fail where a Debug build succeeds. Kept as its own step so a Release-only break is not reported as a
      # test failure.
      - name: Build (Release)
        run: xcodebuild -project Cirruscope.xcodeproj -scheme 'Cirruscope for macOS' -configuration Release -destination 'platform=macOS' build

      # The iOS app target has no tests of its own yet beyond the template stub, so CI only proves it still
      # compiles; these steps become `xcodebuild test` once the first real one lands. A generic Simulator destination
      # avoids pinning a device name that changes with every runner image update — which is also what running tests
      # here would require, a concrete device rather than a generic one. Device destinations are deliberately out of
      # scope: the checked-in ad-hoc default carries no DEVELOPMENT_TEAM, so an iOS device build fails signing,
      # whereas a Simulator build signs ad-hoc happily.
      - name: Build for iOS Simulator (Debug)
        run: xcodebuild -project Cirruscope.xcodeproj -scheme 'Cirruscope for iOS' -configuration Debug -destination 'generic/platform=iOS Simulator' build

      # Release for iOS for the same reason it is built separately for macOS above: whole-module optimization can
      # fail where a Debug build succeeds.
      - name: Build for iOS Simulator (Release)
        run: xcodebuild -project Cirruscope.xcodeproj -scheme 'Cirruscope for iOS' -configuration Release -destination 'generic/platform=iOS Simulator' build

      - name: Upload Test Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
          retention-days: 7
