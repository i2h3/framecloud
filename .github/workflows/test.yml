name: Test

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Resolve Dependencies
        run: xcodebuild -resolvePackageDependencies -project Cirruscope.xcodeproj

      # Builds the app and the test bundle, then runs the unit tests. Debug because `@testable import Cirruscope`
      # needs the testability the Release configuration does not enable. This replaces the former separate Debug
      # build step, which this action performs anyway.
      - name: Test
        run: xcodebuild test -project Cirruscope.xcodeproj -scheme 'Cirruscope for macOS' -configuration Debug -destination 'platform=macOS' -resultBundlePath TestResults.xcresult

      # The tests cannot cover this: Release compiles with whole-module optimization and without testability, so it
      # can fail where a Debug build succeeds. Kept as its own step so a Release-only break is not reported as a
      # test failure.
      - name: Build (Release)
        run: xcodebuild -project Cirruscope.xcodeproj -scheme 'Cirruscope for macOS' -configuration Release -destination 'platform=macOS' build

      # A test action has to run somewhere, so unlike the build steps it needs a concrete Simulator rather than a
      # generic destination. The device is resolved here instead of written into the workflow because the runner
      # image's device list changes with every update, and a pinned name fails the day one is renamed or dropped —
      # an available iPhone on the newest installed iOS runtime is whatever that image happens to offer. Device destinations
      # stay out of scope: the checked-in ad-hoc default carries no DEVELOPMENT_TEAM, so an iOS device build fails
      # signing, whereas a Simulator build signs ad-hoc happily.
      - name: Resolve an iOS Simulator
        id: simulator
        run: |
          name=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; c=[(tuple(int(p) for p in r.rsplit(".",1)[-1].split("-")[1:]), v["name"]) for r,ds in d.items() if "iOS" in r for v in ds if v.get("isAvailable") and "iPhone" in v["name"]]; print(max(c)[1] if c else "")')
          if [ -z "$name" ]; then
            echo 'No iOS Simulator available on this runner image.' >&2
            exit 1
          fi
          echo "Using $name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # Runs the iOS suites, which since the shared `Tests/` folder landed are not only iOS-specific ones: every
      # suite covering `Core/` or `Cirruscope/` runs against this app module too, against a different SDK than the
      # macOS action compiled it with. Debug for the same reason as the macOS action, and this replaces the former
      # Debug build step, which a test action performs anyway.
      - name: Test for iOS Simulator
        run: xcodebuild test -project Cirruscope.xcodeproj -scheme 'Cirruscope for iOS' -configuration Debug -destination 'platform=iOS Simulator,name=${{ steps.simulator.outputs.name }}' -resultBundlePath TestResultsiOS.xcresult

      # Release for iOS for the same reason it is built separately for macOS above: whole-module optimization can
      # fail where a Debug build succeeds.
      - name: Build for iOS Simulator (Release)
        run: xcodebuild -project Cirruscope.xcodeproj -scheme 'Cirruscope for iOS' -configuration Release -destination 'generic/platform=iOS Simulator' build

      - name: Upload Test Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: |
            TestResults.xcresult
            TestResultsiOS.xcresult
          retention-days: 7
