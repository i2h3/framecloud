version = 1

# Xcode project internals present since the project's original 2025 scaffold,
# continuously modified rather than replaced (verified via git history).
# Never hand-edit; annotate here instead, since Xcode rewrites these on
# nearly every build or project-settings change.
[[annotations]]
path = [
    "Cirruscope.xcodeproj/project.pbxproj",
    "Cirruscope.xcodeproj/project.xcworkspace/contents.xcworkspacedata",
]
precedence = "override"
SPDX-FileCopyrightText = "2025 Iva Horn"
SPDX-License-Identifier = "MIT"

# The shared schemes, one per platform, committed in 2026 so `xcodebuild -scheme
# 'Cirruscope for macOS'` and `-scheme 'Cirruscope for iOS'` find the same build
# and test configuration everywhere instead of relying on the per-user schemes
# Xcode autocreates (`xcuserdata` is gitignored). Xcode rewrites them through the
# Scheme editor, so they are annotated here rather than inline.
[[annotations]]
path = [
    "Cirruscope.xcodeproj/xcshareddata/xcschemes/Cirruscope for iOS.xcscheme",
    "Cirruscope.xcodeproj/xcshareddata/xcschemes/Cirruscope for macOS.xcscheme",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Iva Horn"
SPDX-License-Identifier = "MIT"

# SwiftPM's resolved-dependency lockfile: deleted and regenerated fresh in
# 2026 when the app was rewritten, so its current content dates from then.
[[annotations]]
path = "Cirruscope.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"
precedence = "override"
SPDX-FileCopyrightText = "2026 Iva Horn"
SPDX-License-Identifier = "MIT"

# Asset catalog root manifest: present since 2025, continuously carried
# through the Framecloud-to-Cirruscope rename and the move into Core/ without
# being replaced.
[[annotations]]
path = "Core/Assets.xcassets/Contents.json"
precedence = "override"
SPDX-FileCopyrightText = "2025 Iva Horn"
SPDX-License-Identifier = "MIT"

# Asset catalog contents added in 2026, owned by Xcode's Asset Catalog editor.
# WidgetBackground came from the widget extension's own catalog, folded into
# this one so the accent colour has a single definition.
[[annotations]]
path = [
    "Core/Assets.xcassets/AccentColor.colorset/Contents.json",
    "Core/Assets.xcassets/WidgetBackground.colorset/Contents.json",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Iva Horn"
SPDX-License-Identifier = "MIT"

# App icon (Xcode 26 Icon Composer .icon bundle): icon.json is pure JSON,
# and editing the icon visually in Icon Composer can regenerate the whole
# bundle with no guarantee an inline comment survives, so every layer is
# annotated here rather than inline. icon.json and Cloud.svg have been
# present since 2025, carried through the rename without being replaced;
# the remaining layers were added later, in 2026.
[[annotations]]
path = [
    "Cirruscope/AppIcon.icon/icon.json",
    "Cirruscope/AppIcon.icon/Assets/Cloud.svg",
]
precedence = "override"
SPDX-FileCopyrightText = "2025 Iva Horn"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = [
    "Cirruscope/AppIcon.icon/Assets/Zoom.svg",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Iva Horn"
SPDX-License-Identifier = "MIT"

# Miscellaneous Xcode-GUI-editable or generated files, all added in 2026:
# Interface Builder storyboard, the Privacy Manifest editor's file, the
# Info tab's files for both apps and the widget extension, the six String
# Catalogs (JSON: one for each app target's own Swift and SwiftUI strings, one
# for the widget extension's, one for storyboard strings since migrating off
# per-locale Main.strings files, one for the Info.plist usage descriptions, and
# one for App Shortcut phrases), the bare version file SwiftFormat itself
# parses, and the root LICENSE text.
[[annotations]]
path = [
    ".swift-version",
    "LICENSE",
    "Cirruscope/Cirruscope.entitlements",
    "Cirruscope/PrivacyInfo.xcprivacy",
    "iOS/Info.plist",
    "iOS/Localizable.xcstrings",
    "macOS/AppShortcuts.xcstrings",
    "macOS/Base.lproj/Main.storyboard",
    "macOS/Info.plist",
    "macOS/InfoPlist.xcstrings",
    "macOS/Localizable.xcstrings",
    "macOS/mul.lproj/Main.xcstrings",
    "Widgets/Info.plist",
    "Widgets/Localizable.xcstrings",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Iva Horn"
SPDX-License-Identifier = "MIT"

# Website: everything under it is this project's own work by default. A
# blanket wildcard rather than an explicit file list for now.
[[annotations]]
path = "Website/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 Iva Horn"
SPDX-License-Identifier = "MIT"

# GitHub pre-fills a new pull request's description textarea (unrendered, so
# HTML comments show up as literal visible text) with this file's raw content,
# so it is annotated here instead of carrying an inline header like other
# Markdown files.
[[annotations]]
path = ".github/PULL_REQUEST_TEMPLATE.md"
precedence = "override"
SPDX-FileCopyrightText = "2026 Iva Horn"
SPDX-License-Identifier = "MIT"
